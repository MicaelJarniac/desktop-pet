<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="pet-container">
    <div id="sprite"></div>
    <div id="name">Pixel</div>

    <div id="stats">
      <div class="stat">
        <span class="stat-label">🍖</span>
        <div class="stat-bar"><div id="hunger-bar" class="stat-fill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">💛</span>
        <div class="stat-bar"><div id="happiness-bar" class="stat-fill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">⚡</span>
        <div class="stat-bar"><div id="energy-bar" class="stat-fill"></div></div>
      </div>
    </div>

    <div id="buttons">
      <button id="btn-feed" title="Feed">🍖</button>
      <button id="btn-play" title="Play">🎾</button>
      <button id="btn-sleep" title="Sleep">💤</button>
      <button id="btn-settings" title="Settings">⚙️</button>
    </div>

    <div id="status-message"></div>
  </div>

  <script src="utils/color.js"></script>
  <script src="settings-schema.js"></script>
  <script src="pet.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
